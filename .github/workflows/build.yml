name: Build Android App
on: { push: { branches: ["main"] }, pull_request: { branches: ["main"] }, workflow_dispatch: }
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest; timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4; with: { distribution: 'temurin', java-version: '17', cache: 'gradle' }
      - uses: android-actions/setup-android@v3; with: { api-level: 34, build-tools-version: '34.0.0' }
      - uses: actions/cache@v4; with: { path: ~/.gradle/caches, key: gradle-${{ hashFiles('**/*.gradle*') } }
      - run: chmod +x ./gradlew
      - name: Build Debug APK; run: ./gradlew assembleDebug --stacktrace; env: { GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g" }
      - name: Build Release AAB; run: ./gradlew bundleRelease --stacktrace; env: { GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g" }
      - uses: actions/upload-artifact@v4; with: { name: app-debug-apk, path: app/build/outputs/apk/debug/app-debug.apk, retention-days: 7 }
      - uses: actions/upload-artifact@v4; with: { name: app-release-aab, path: app/build/outputs/bundle/release/app-release.aab, retention-days: 30 }
